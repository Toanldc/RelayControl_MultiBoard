; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 9600

; Most "ESP32-C3 SuperMini" boards have no USB-UART bridge chip;
; Serial goes over the native USB peripheral, so USB CDC must be
; enabled on boot for Serial.begin()/Serial.println() to work.
;
; CORE_DEBUG_LEVEL=3 surfaces log_e()/log_w()/log_i() calls from the BLE
; library over Serial (e.g. esp_ble_gap_config_adv_data failures), which
; are otherwise silently swallowed at the default level 0. Useful while
; debugging BLE advertising/connection issues; safe to leave on.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=3

; Onboard WS2812 RGB status LED (GPIO8 on most ESP32-C3 SuperMini boards).
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.3
